plugins {
    id 'java'
    id 'maven-publish'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.mudassirshahzad'
version = '0.8.4'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    // Published alongside the library so consumers can navigate into EKA's domain
    // model and port interfaces from their IDE. Javadoc is deliberately not published
    // yet — see docs/platform/consuming-eka.md.
    withSourcesJar()
}

ext {
    springAiVersion  = '1.1.8'
    jjwtVersion      = '0.13.0'
    tikaVersion      = '4.0.0'
    archunitVersion  = '1.5.1'
    springdocVersion = '2.9.1'
}

// ── Managed-dependency overrides (security) ────────────────────────────────
// Spring Boot's BOM is the source of truth for every version below; each entry
// here exists only because the BOM's pin is older than the first patched release
// for an advisory that applies to this application. Each is a patch/minor move
// inside the line Boot already targets, and each should be DELETED as soon as a
// Boot upgrade carries the same version or newer — see docs/analysis/dependency-roadmap.md.
//
//   tomcat        Boot 3.5.16 pins 10.1.55; three criticals (GHSA-h3x4-894j-xpx5,
//                 GHSA-9xv2-5v5q-p794, GHSA-gcx9-497g-6cp6) are first patched in
//                 10.1.58, which was never published to Maven Central — 10.1.60 is
//                 the first available release that carries the fixes.
//   commons-lang3 arrives via Tika. 1 medium.
//   spring-retry  arrives via Spring AI. 1 medium.
//   log4j-api     arrives via Tika (API jar only, no Log4j core binding). 1 medium.
//   httpclient5 / httpcore5
//                 arrive via the Weaviate client. httpcore5 5.3.x carries 2 highs
//                 (GHSA-hf6x-8p5f-cgmf, GHSA-v3jc-474w-2wm6), first patched in 5.4.3.
//                 These two move together on purpose: httpclient5 5.6.4 is built against
//                 httpcore5 5.4.3 (its parent POM's httpcore.version), so raising core
//                 without client would pair a 5.4 core with a client compiled for 5.3.
//   postgresql    Boot 3.5.16 pins 42.7.11; GHSA-j92g-9f8w-j867 is first patched in 42.7.12.
//   jackson       Boot 3.5.16 pins the jackson BOM at 2.21.4 — and the BOM *wins*, forcing
//                 transitively-requested 2.22.x back down to it. GHSA-5jmj-h7xm-6q6v needs
//                 2.21.5. 2.21.7 is the current release on that same 2.21 line; 2.22.x is
//                 deliberately not taken, since staying on the line Boot targets is the
//                 whole point of these overrides.
ext['tomcat.version']        = '10.1.60'
ext['commons-lang3.version'] = '3.18.0'
ext['spring-retry.version']  = '2.0.13'
ext['log4j2.version']        = '2.25.5'
ext['httpclient5.version']   = '5.6.4'
ext['httpcore5.version']     = '5.4.4'
ext['postgresql.version']    = '42.7.13'
ext['jackson-bom.version']   = '2.21.7'

repositories {
    mavenCentral()
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
    }
}

dependencies {

    // ── Spring Boot ────────────────────────────────────────────────────────
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // ── Spring AI ──────────────────────────────────────────────────────────
    implementation 'org.springframework.ai:spring-ai-starter-model-ollama'
    implementation 'org.springframework.ai:spring-ai-starter-vector-store-weaviate'

    // ── Database ───────────────────────────────────────────────────────────
    runtimeOnly 'org.postgresql:postgresql'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'

    // ── JWT ────────────────────────────────────────────────────────────────
    implementation "io.jsonwebtoken:jjwt-api:${jjwtVersion}"
    runtimeOnly   "io.jsonwebtoken:jjwt-impl:${jjwtVersion}"
    runtimeOnly   "io.jsonwebtoken:jjwt-jackson:${jjwtVersion}"

    // ── Apache Tika ────────────────────────────────────────────────────────
    implementation "org.apache.tika:tika-core:${tikaVersion}"
    implementation "org.apache.tika:tika-parsers-standard-package:${tikaVersion}"

    // ── Lombok (compile-only — excluded from the final JAR) ────────────────
    compileOnly         'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testCompileOnly         'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    // ── Observability ──────────────────────────────────────────────────────
    implementation 'io.micrometer:micrometer-registry-prometheus'

    // ── API documentation ──────────────────────────────────────────────────
    implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${springdocVersion}"

    // ── Test ───────────────────────────────────────────────────────────────
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation "com.tngtech.archunit:archunit-junit5:${archunitVersion}"
    testImplementation 'org.testcontainers:postgresql'
    testImplementation 'org.testcontainers:junit-jupiter'
}

// ── Tests ──────────────────────────────────────────────────────────────────
tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

// ── Publishing (platform enablement) ───────────────────────────────────────
// EKA is consumed two ways, and they need different artifacts:
//
//   the library  build/libs/project-eka-<version>.jar        <- plain jar, no classifier
//   the app      build/libs/project-eka-<version>-boot.jar   <- executable fat jar
//
// Gradle's default is the other way round (the boot jar takes the bare name and the
// library gets `-plain`), which would publish a 146MB fat jar as the dependency
// artifact — every consumer would inherit a flattened, repackaged copy of the whole
// dependency tree. Swapping the classifiers makes the *library* the primary artifact,
// which is what `from components.java` publishes.
//
// NOTE: `Dockerfile` copies the boot jar by its exact name. If the classifier below
// changes, that COPY must change with it — the two are coupled on purpose, because a
// glob there silently matched whichever jar happened to exist.
tasks.named('jar') {
    archiveClassifier = ''
}
tasks.named('bootJar') {
    archiveClassifier = 'boot'
}

// Gradle Module Metadata is deliberately NOT published.
//
// Versions in this build come from Spring's `io.spring.dependency-management` plugin
// (a Maven-style BOM import), which is also what makes the `ext['tomcat.version']`
// security overrides above work. That plugin writes its resolved versions into the
// generated POM's <dependencyManagement> block — but *not* into Gradle Module
// Metadata, which ends up listing every dependency with no version at all.
//
// Gradle prefers .module over .pom when both are present, so publishing both would
// hand Gradle consumers a versionless dependency graph that fails to resolve with
// "Could not find org.postgresql:postgresql:." — verified against a real consumer
// project, not assumed. Publishing the POM alone is correct for both Maven and
// Gradle consumers, because Gradle honours <dependencyManagement> as constraints.
//
// The alternative fix is migrating to Gradle's native `platform()` BOM support, which
// would produce correct module metadata — but it would also invalidate every
// `ext['*.version']` override above, so it belongs with the module split, not here.
tasks.withType(GenerateModuleMetadata).configureEach {
    enabled = false
}

publishing {
    publications {
        library(MavenPublication) {
            artifactId = 'project-eka'
            from components.java

            pom {
                name        = 'Project EKA'
                description = 'Enterprise RAG platform: domain model, ports, retrieval, and LLM gateway.'
                url         = 'https://github.com/mudassirshahzad/project-eka'
                licenses {
                    license {
                        name = 'Apache License 2.0'
                        url  = 'https://www.apache.org/licenses/LICENSE-2.0'
                    }
                }
                developers {
                    developer {
                        id   = 'mudassirshahzad'
                        name = 'Mudassir Shahzad'
                    }
                }
                scm {
                    url = 'https://github.com/mudassirshahzad/project-eka'
                }
            }
        }
    }

    repositories {
        // `gradle publishToMavenLocal` — the zero-infrastructure path for developing a
        // consumer against an unreleased EKA build on the same machine.
        mavenLocal()

        // GitHub Packages. Credentials come from the environment rather than
        // gradle.properties so that nothing resolvable to a token is ever committed;
        // in CI, GITHUB_ACTOR/GITHUB_TOKEN are provided by Actions. Publishing is a
        // no-op locally when they are unset — the repository is simply unusable, which
        // fails only the `publishAllPublicationsToGitHubPackagesRepository` task and
        // never `build`.
        maven {
            name = 'GitHubPackages'
            url  = 'https://maven.pkg.github.com/mudassirshahzad/project-eka'
            credentials {
                username = System.getenv('GITHUB_ACTOR')
                password = System.getenv('GITHUB_TOKEN')
            }
        }
    }
}

// ── Build info (v0.6.1, ADR EX03) ───────────────────────────────────────────
// Generates META-INF/build-info.properties from `version` above; Spring Boot's
// actuator auto-exposes it as `info.build.version` on /actuator/info with zero
// manual sync. `project.version` is the single source of truth going forward —
// see docs/governance and .claude/DECISIONS.md ADR EX03 for the release/tag
// alignment this is expected to keep in step with.
springBoot {
    buildInfo()
}
