<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 916" width="720" height="916"
     font-family="'Segoe UI', system-ui, -apple-system, sans-serif">

  <defs>
    <!-- Implemented flow — same blue marker as ingestion-pipeline.svg / architecture.svg -->
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#2563eb"/>
    </marker>
    <!-- Roadmap connector — muted, for work that is not built -->
    <marker id="arr-gray" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="720" height="916" fill="#ffffff"/>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- TITLE                                                   -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <text x="225" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Retrieval &amp; RAG Pipeline</text>
  <text x="225" y="54" text-anchor="middle" font-size="11" fill="#64748b">v0.8.4 — Implemented end-to-end</text>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- Layout mirrors ingestion-pipeline.svg exactly:          -->
  <!-- box x=60 w=330 h=62 gap=18 stride=80                    -->
  <!-- Boxes: y=88,168,248,(fork 328),408,488,568,648,728,808  -->
  <!-- Arrows: bottom-of-box to bottom-of-box + 16             -->
  <!-- ═══════════════════════════════════════════════════════ -->

  <!-- ── STEP 1: User Question ── -->
  <rect x="60" y="88" width="330" height="62" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="225" y="112" text-anchor="middle" font-size="12" font-weight="700" fill="#1d4ed8">1 · User Question</text>
  <text x="225" y="131" text-anchor="middle" font-size="10" fill="#3b82f6">Natural language query · conversation context</text>
  <line x1="225" y1="150" x2="225" y2="166" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ── STEP 2: Query Rewrite ── -->
  <rect x="60" y="168" width="330" height="62" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="225" y="192" text-anchor="middle" font-size="12" font-weight="700" fill="#1d4ed8">2 · Query Rewrite</text>
  <text x="225" y="211" text-anchor="middle" font-size="10" fill="#3b82f6">Ollama LLM · HyDE variant opt-in (v0.8.3)</text>
  <line x1="225" y1="230" x2="225" y2="246" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ── STEP 3: Hybrid Retrieval (forks into 4a / 4b) ── -->
  <rect x="60" y="248" width="330" height="62" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="225" y="272" text-anchor="middle" font-size="12" font-weight="700" fill="#1d4ed8">3 · Hybrid Retrieval</text>
  <text x="225" y="291" text-anchor="middle" font-size="10" fill="#3b82f6">Parallel semantic + keyword search</text>

  <!-- Fork: straight verticals dropped onto each child, as architecture.svg does -->
  <line x1="138" y1="310" x2="138" y2="326" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="312" y1="310" x2="312" y2="326" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ── STEP 4: parallel engines (styled as architecture.svg's adapter boxes) ── -->
  <rect x="60" y="328" width="156" height="62" rx="6" fill="#f8fafc" stroke="#2563eb" stroke-width="1.5"/>
  <text x="138" y="354" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">Weaviate Search</text>
  <text x="138" y="371" text-anchor="middle" font-size="10" fill="#64748b">ANN vector search</text>

  <rect x="234" y="328" width="156" height="62" rx="6" fill="#f8fafc" stroke="#2563eb" stroke-width="1.5"/>
  <text x="312" y="354" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">PostgreSQL BM25</text>
  <text x="312" y="371" text-anchor="middle" font-size="10" fill="#64748b">Full-text keyword search</text>

  <!-- Join: both engines drop onto the fusion step below -->
  <line x1="138" y1="390" x2="138" y2="406" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="312" y1="390" x2="312" y2="406" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ── STEP 5: Fusion / Re-ranking ── -->
  <rect x="60" y="408" width="330" height="62" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="225" y="432" text-anchor="middle" font-size="12" font-weight="700" fill="#1d4ed8">5 · Fusion / Re-ranking</text>
  <text x="225" y="451" text-anchor="middle" font-size="10" fill="#3b82f6">RRF · classification-filtered · re-rank opt-in</text>
  <line x1="225" y1="470" x2="225" y2="486" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ── STEP 6: Context Assembly ── -->
  <rect x="60" y="488" width="330" height="62" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="225" y="512" text-anchor="middle" font-size="12" font-weight="700" fill="#1d4ed8">6 · Context Assembly</text>
  <text x="225" y="531" text-anchor="middle" font-size="10" fill="#3b82f6">Token-budget guard · markers [SOURCE:N]</text>
  <line x1="225" y1="550" x2="225" y2="566" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ── STEP 7: Prompt Builder ── -->
  <rect x="60" y="568" width="330" height="62" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="225" y="592" text-anchor="middle" font-size="12" font-weight="700" fill="#1d4ed8">7 · Prompt Builder</text>
  <text x="225" y="611" text-anchor="middle" font-size="10" fill="#3b82f6">System prompt · untrusted context fenced (v0.8.4)</text>
  <line x1="225" y1="630" x2="225" y2="646" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ── STEP 8: LLM Generation ── -->
  <rect x="60" y="648" width="330" height="62" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="225" y="672" text-anchor="middle" font-size="12" font-weight="700" fill="#1d4ed8">8 · LLM Generation</text>
  <text x="225" y="691" text-anchor="middle" font-size="10" fill="#3b82f6">Qwen3 via Ollama · output guardrails</text>
  <line x1="225" y1="710" x2="225" y2="726" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ── STEP 9: Grounded Response ── -->
  <rect x="60" y="728" width="330" height="62" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="225" y="752" text-anchor="middle" font-size="12" font-weight="700" fill="#1d4ed8">9 · Grounded Response</text>
  <text x="225" y="771" text-anchor="middle" font-size="10" fill="#3b82f6">Citations resolved · [SOURCE:N] markers</text>
  <line x1="225" y1="790" x2="225" y2="806" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ── STEP 10: Conversation Memory ── -->
  <rect x="60" y="808" width="330" height="62" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="225" y="832" text-anchor="middle" font-size="12" font-weight="700" fill="#1d4ed8">10 · Conversation Memory</text>
  <text x="225" y="851" text-anchor="middle" font-size="10" fill="#3b82f6">Sliding window · multi-turn context (v0.5.0)</text>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- FUTURE INTEGRATIONS (right panel)                       -->
  <!-- Same header + hairline + dashed-card treatment as the   -->
  <!-- FUTURE EXTENSIONS panel in architecture.svg             -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <text x="550" y="360" text-anchor="middle" font-size="10" fill="#64748b" font-weight="700" letter-spacing="0.8">FUTURE INTEGRATIONS</text>
  <line x1="450" y1="365" x2="660" y2="365" stroke="#cbd5e1" stroke-width="1"/>
  <text x="550" y="380" text-anchor="middle" font-size="9" fill="#94a3b8">Not implemented · frozen roadmap (ADR GOV03)</text>

  <!-- MCP Server — Phase 8 spike only; full delivery post-v1.0 -->
  <rect x="440" y="392" width="220" height="46" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="550" y="411" text-anchor="middle" font-size="11" font-weight="600" fill="#475569">MCP Server</text>
  <text x="550" y="428" text-anchor="middle" font-size="10" fill="#64748b">Phase 8 — go/no-go spike only</text>

  <!-- LangGraph — post-v1.0 -->
  <rect x="440" y="452" width="220" height="46" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="550" y="471" text-anchor="middle" font-size="11" font-weight="600" fill="#475569">LangGraph</text>
  <text x="550" y="488" text-anchor="middle" font-size="10" fill="#64748b">Post-v1.0 — graph orchestration</text>

  <!-- Multi-Agent — post-v1.0 -->
  <rect x="440" y="512" width="220" height="46" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="550" y="531" text-anchor="middle" font-size="11" font-weight="600" fill="#475569">Multi-Agent Coordination</text>
  <text x="550" y="548" text-anchor="middle" font-size="10" fill="#64748b">Post-v1.0 — agent-to-agent protocol</text>

  <!-- Streaming responses — Phase 8 -->
  <rect x="440" y="572" width="220" height="46" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="550" y="591" text-anchor="middle" font-size="11" font-weight="600" fill="#475569">Streaming Responses</text>
  <text x="550" y="608" text-anchor="middle" font-size="10" fill="#64748b">Phase 8 — SSE on the chat endpoint</text>

  <!-- Connectors: fusion step right edge (390,439) → roadmap cards -->
  <line x1="390" y1="439" x2="438" y2="415" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arr-gray)"/>
  <line x1="390" y1="439" x2="438" y2="475" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arr-gray)"/>
  <line x1="390" y1="439" x2="438" y2="535" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arr-gray)"/>

</svg>
