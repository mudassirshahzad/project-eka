<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 940" width="780" height="940"
     font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', sans-serif">

  <defs>
    <!-- Implemented stage: restrained vertical gradient for depth, not decoration -->
    <linearGradient id="g-impl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#1f8b3d"/>
      <stop offset="100%" stop-color="#16702f"/>
    </linearGradient>
    <!-- Current phase accent: draws the eye to the one stage Phase 7 changed -->
    <linearGradient id="g-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#1f6feb"/>
      <stop offset="100%" stop-color="#0860ca"/>
    </linearGradient>
    <!-- Roadmap card: subtle blue tint -->
    <linearGradient id="g-future" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#eaf5ff"/>
      <stop offset="100%" stop-color="#ddf0ff"/>
    </linearGradient>

    <!-- Soft elevation. Low opacity on purpose: depth, never gloss -->
    <filter id="elev" x="-20%" y="-25%" width="140%" height="165%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#0b1b2b" flood-opacity="0.16"/>
    </filter>
    <filter id="elev-sm" x="-20%" y="-25%" width="140%" height="165%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0b1b2b" flood-opacity="0.13"/>
    </filter>

    <!-- Implemented flow: solid, high-contrast slate -->
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#57606a"/>
    </marker>
    <!-- Roadmap connector: muted, used only for work that is not built -->
    <marker id="arr-muted" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#8c959f"/>
    </marker>
  </defs>

  <!-- Opaque light canvas: keeps contrast identical in GitHub light and dark mode -->
  <rect width="780" height="940" fill="#ffffff"/>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- TITLE (centered on full canvas width 780)              -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <text x="390" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2328" letter-spacing="0.2">Retrieval &amp; RAG Pipeline</text>
  <rect x="366" y="42" width="48" height="3" rx="1.5" fill="#0969da"/>
  <text x="390" y="62" text-anchor="middle" font-size="11" fill="#59636e">Implemented end-to-end · current release v0.8.4</text>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- MAIN PIPELINE                                           -->
  <!-- Box: x=68 w=344 h=58  centered at x=240               -->
  <!-- Stride: 76 (58+18)                                     -->
  <!-- y positions: 72,148,224,(fork 300-356),380,456,532,608,684,760 -->
  <!-- Step badge: circle cx=94, cy = y+29                    -->
  <!-- ═══════════════════════════════════════════════════════ -->

  <!-- ── 1. User Question ── -->
  <rect x="68" y="72" width="344" height="58" rx="8" fill="url(#g-impl)" stroke="#0f5c27" stroke-width="1.25" filter="url(#elev)"/>
  <circle cx="94" cy="101" r="11" fill="#ffffff" fill-opacity="0.16" stroke="#ffffff" stroke-opacity="0.38" stroke-width="1"/>
  <text x="94" y="105" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">1</text>
  <text x="248" y="96" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff" letter-spacing="0.15">User Question</text>
  <text x="248" y="115" text-anchor="middle" font-size="10" fill="#ffffff" fill-opacity="0.84">Natural language query · conversation context</text>
  <line x1="240" y1="130" x2="240" y2="146" stroke="#57606a" stroke-width="2" stroke-linecap="round" marker-end="url(#arr)"/>

  <!-- ── 2. Query Rewrite ── -->
  <rect x="68" y="148" width="344" height="58" rx="8" fill="url(#g-impl)" stroke="#0f5c27" stroke-width="1.25" filter="url(#elev)"/>
  <circle cx="94" cy="177" r="11" fill="#ffffff" fill-opacity="0.16" stroke="#ffffff" stroke-opacity="0.38" stroke-width="1"/>
  <text x="94" y="181" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">2</text>
  <text x="248" y="172" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff" letter-spacing="0.15">Query Rewrite</text>
  <text x="248" y="191" text-anchor="middle" font-size="10" fill="#ffffff" fill-opacity="0.84">Ollama LLM · HyDE variant opt-in (v0.8.3)</text>
  <line x1="240" y1="206" x2="240" y2="222" stroke="#57606a" stroke-width="2" stroke-linecap="round" marker-end="url(#arr)"/>

  <!-- ── 3. Hybrid Retrieval (fork) ── -->
  <rect x="68" y="224" width="344" height="58" rx="8" fill="url(#g-impl)" stroke="#0f5c27" stroke-width="1.25" filter="url(#elev)"/>
  <circle cx="94" cy="253" r="11" fill="#ffffff" fill-opacity="0.16" stroke="#ffffff" stroke-opacity="0.38" stroke-width="1"/>
  <text x="94" y="257" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">3</text>
  <text x="248" y="248" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff" letter-spacing="0.15">Hybrid Retrieval</text>
  <text x="248" y="267" text-anchor="middle" font-size="10" fill="#ffffff" fill-opacity="0.84">Parallel semantic + keyword search</text>

  <!-- Fork: smooth curves from bottom center of Hybrid (240,282) into 4a / 4b -->
  <path d="M240,282 C240,293 134,287 134,298" fill="none" stroke="#57606a" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arr)"/>
  <path d="M240,282 C240,293 346,287 346,298" fill="none" stroke="#57606a" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arr)"/>

  <!-- ── 4a. Weaviate Search  x=68 w=132 center=134 ── -->
  <rect x="68" y="300" width="132" height="52" rx="6" fill="url(#g-impl)" stroke="#0f5c27" stroke-width="1.1" filter="url(#elev-sm)"/>
  <text x="134" y="322" text-anchor="middle" font-size="11" font-weight="600" fill="#ffffff">Weaviate Search</text>
  <text x="134" y="338" text-anchor="middle" font-size="9" fill="#ffffff" fill-opacity="0.82">ANN vector search</text>

  <!-- ── 4b. PostgreSQL BM25  x=280 w=132 center=346 ── -->
  <rect x="280" y="300" width="132" height="52" rx="6" fill="url(#g-impl)" stroke="#0f5c27" stroke-width="1.1" filter="url(#elev-sm)"/>
  <text x="346" y="322" text-anchor="middle" font-size="11" font-weight="600" fill="#ffffff">PostgreSQL BM25</text>
  <text x="346" y="338" text-anchor="middle" font-size="9" fill="#ffffff" fill-opacity="0.82">Full-text keyword search</text>

  <!-- Join: smooth curves from 4a / 4b into Fusion (240,378) -->
  <path d="M134,352 C134,365 240,367 240,378" fill="none" stroke="#57606a" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arr)"/>
  <path d="M346,352 C346,365 240,367 240,378" fill="none" stroke="#57606a" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arr)"/>

  <!-- ── 5. Fusion / Re-ranking ── CURRENT PHASE ACCENT (Phase 7 · v0.8.3) -->
  <rect x="68" y="380" width="344" height="58" rx="8" fill="url(#g-accent)" stroke="#0a4fa3" stroke-width="1.5" filter="url(#elev)"/>
  <circle cx="94" cy="409" r="11" fill="#ffffff" fill-opacity="0.18" stroke="#ffffff" stroke-opacity="0.42" stroke-width="1"/>
  <text x="94" y="413" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">5</text>
  <rect x="332" y="390" width="62" height="15" rx="7.5" fill="#ffffff" fill-opacity="0.2"/>
  <text x="363" y="401" text-anchor="middle" font-size="8" font-weight="700" fill="#ffffff" letter-spacing="0.7">PHASE 7</text>
  <text x="248" y="404" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff" letter-spacing="0.15">Fusion / Re-ranking</text>
  <text x="248" y="423" text-anchor="middle" font-size="10" fill="#ffffff" fill-opacity="0.86">RRF · classification-filtered · re-rank opt-in</text>
  <line x1="240" y1="438" x2="240" y2="454" stroke="#57606a" stroke-width="2" stroke-linecap="round" marker-end="url(#arr)"/>

  <!-- ── 6. Context Assembly ── -->
  <rect x="68" y="456" width="344" height="58" rx="8" fill="url(#g-impl)" stroke="#0f5c27" stroke-width="1.25" filter="url(#elev)"/>
  <circle cx="94" cy="485" r="11" fill="#ffffff" fill-opacity="0.16" stroke="#ffffff" stroke-opacity="0.38" stroke-width="1"/>
  <text x="94" y="489" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">6</text>
  <text x="248" y="480" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff" letter-spacing="0.15">Context Assembly</text>
  <text x="248" y="499" text-anchor="middle" font-size="10" fill="#ffffff" fill-opacity="0.84">Token-budget guard · markers [SOURCE:N]</text>
  <line x1="240" y1="514" x2="240" y2="530" stroke="#57606a" stroke-width="2" stroke-linecap="round" marker-end="url(#arr)"/>

  <!-- ── 7. Prompt Builder ── -->
  <rect x="68" y="532" width="344" height="58" rx="8" fill="url(#g-impl)" stroke="#0f5c27" stroke-width="1.25" filter="url(#elev)"/>
  <circle cx="94" cy="561" r="11" fill="#ffffff" fill-opacity="0.16" stroke="#ffffff" stroke-opacity="0.38" stroke-width="1"/>
  <text x="94" y="565" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">7</text>
  <text x="248" y="556" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff" letter-spacing="0.15">Prompt Builder</text>
  <text x="248" y="575" text-anchor="middle" font-size="10" fill="#ffffff" fill-opacity="0.84">System prompt · untrusted context fenced (v0.8.4)</text>
  <line x1="240" y1="590" x2="240" y2="606" stroke="#57606a" stroke-width="2" stroke-linecap="round" marker-end="url(#arr)"/>

  <!-- ── 8. LLM Generation ── -->
  <rect x="68" y="608" width="344" height="58" rx="8" fill="url(#g-impl)" stroke="#0f5c27" stroke-width="1.25" filter="url(#elev)"/>
  <circle cx="94" cy="637" r="11" fill="#ffffff" fill-opacity="0.16" stroke="#ffffff" stroke-opacity="0.38" stroke-width="1"/>
  <text x="94" y="641" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">8</text>
  <text x="248" y="632" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff" letter-spacing="0.15">LLM Generation</text>
  <text x="248" y="651" text-anchor="middle" font-size="10" fill="#ffffff" fill-opacity="0.84">Qwen3 via Ollama · output guardrails</text>
  <line x1="240" y1="666" x2="240" y2="682" stroke="#57606a" stroke-width="2" stroke-linecap="round" marker-end="url(#arr)"/>

  <!-- ── 9. Grounded Response ── -->
  <rect x="68" y="684" width="344" height="58" rx="8" fill="url(#g-impl)" stroke="#0f5c27" stroke-width="1.25" filter="url(#elev)"/>
  <circle cx="94" cy="713" r="11" fill="#ffffff" fill-opacity="0.16" stroke="#ffffff" stroke-opacity="0.38" stroke-width="1"/>
  <text x="94" y="717" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">9</text>
  <text x="248" y="708" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff" letter-spacing="0.15">Grounded Response</text>
  <text x="248" y="727" text-anchor="middle" font-size="10" fill="#ffffff" fill-opacity="0.84">Citations resolved · [SOURCE:N] markers</text>
  <line x1="240" y1="742" x2="240" y2="758" stroke="#57606a" stroke-width="2" stroke-linecap="round" marker-end="url(#arr)"/>

  <!-- ── 10. Conversation Memory ── -->
  <rect x="68" y="760" width="344" height="58" rx="8" fill="url(#g-impl)" stroke="#0f5c27" stroke-width="1.25" filter="url(#elev)"/>
  <circle cx="94" cy="789" r="11" fill="#ffffff" fill-opacity="0.16" stroke="#ffffff" stroke-opacity="0.38" stroke-width="1"/>
  <text x="94" y="793" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">10</text>
  <text x="248" y="784" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff" letter-spacing="0.15">Conversation Memory</text>
  <text x="248" y="803" text-anchor="middle" font-size="10" fill="#ffffff" fill-opacity="0.84">Sliding window · multi-turn context (v0.5.0)</text>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- FUTURE INTEGRATIONS (right panel, x=460+)              -->
  <!-- Versions per the frozen roadmap (ADR GOV03)            -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <rect x="460" y="196" width="300" height="348" rx="10" fill="#f9fbfd" stroke="#e1e7ee" stroke-width="1"/>
  <text x="618" y="221" text-anchor="middle" font-size="9.5" fill="#57606a" font-weight="700" letter-spacing="1.1">FUTURE INTEGRATIONS</text>
  <line x1="480" y1="230" x2="756" y2="230" stroke="#e1e7ee" stroke-width="1"/>
  <text x="618" y="247" text-anchor="middle" font-size="9" fill="#8c959f">Not implemented · frozen roadmap (ADR GOV03)</text>

  <!-- MCP Server — Phase 8 spike only; full delivery post-v1.0 -->
  <rect x="472" y="262" width="278" height="52" rx="7" fill="url(#g-future)" stroke="#54aeff" stroke-width="1.25" stroke-dasharray="5,3" filter="url(#elev-sm)"/>
  <text x="611" y="283" text-anchor="middle" font-size="11" font-weight="600" fill="#0a3069">MCP Server</text>
  <text x="611" y="300" text-anchor="middle" font-size="9" fill="#0550ae">Phase 8 — go/no-go spike only</text>

  <!-- LangGraph — post-v1.0 -->
  <rect x="472" y="332" width="278" height="52" rx="7" fill="url(#g-future)" stroke="#54aeff" stroke-width="1.25" stroke-dasharray="5,3" filter="url(#elev-sm)"/>
  <text x="611" y="353" text-anchor="middle" font-size="11" font-weight="600" fill="#0a3069">LangGraph</text>
  <text x="611" y="370" text-anchor="middle" font-size="9" fill="#0550ae">Post-v1.0 — graph orchestration</text>

  <!-- Multi-Agent — post-v1.0 -->
  <rect x="472" y="402" width="278" height="52" rx="7" fill="url(#g-future)" stroke="#54aeff" stroke-width="1.25" stroke-dasharray="5,3" filter="url(#elev-sm)"/>
  <text x="611" y="423" text-anchor="middle" font-size="11" font-weight="600" fill="#0a3069">Multi-Agent Coordination</text>
  <text x="611" y="440" text-anchor="middle" font-size="9" fill="#0550ae">Post-v1.0 — agent-to-agent protocol</text>

  <!-- Streaming responses — Phase 8 (the claim removed from stage 8) -->
  <rect x="472" y="472" width="278" height="52" rx="7" fill="url(#g-future)" stroke="#54aeff" stroke-width="1.25" stroke-dasharray="5,3" filter="url(#elev-sm)"/>
  <text x="611" y="493" text-anchor="middle" font-size="11" font-weight="600" fill="#0a3069">Streaming Responses</text>
  <text x="611" y="510" text-anchor="middle" font-size="9" fill="#0550ae">Phase 8 — SSE on the chat endpoint</text>

  <!-- Connector lines: pipeline → roadmap cards -->
  <path d="M412,288 C436,288 448,288 468,288" fill="none" stroke="#8c959f" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arr-muted)"/>
  <path d="M412,358 C436,358 448,358 468,358" fill="none" stroke="#8c959f" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arr-muted)"/>
  <path d="M412,428 C436,428 448,428 468,428" fill="none" stroke="#8c959f" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arr-muted)"/>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- LEGEND                                                  -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <rect x="68" y="848" width="480" height="52" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
  <text x="308" y="867" text-anchor="middle" font-size="9.5" font-weight="700" fill="#57606a" letter-spacing="1">LEGEND</text>

  <rect x="84" y="876" width="18" height="12" rx="3" fill="url(#g-impl)" stroke="#0f5c27" stroke-width="1"/>
  <text x="108" y="886" font-size="10" fill="#1f2328">Implemented</text>

  <rect x="196" y="876" width="18" height="12" rx="3" fill="url(#g-accent)" stroke="#0a4fa3" stroke-width="1"/>
  <text x="220" y="886" font-size="10" fill="#1f2328">Phase 7 · opt-in</text>

  <rect x="330" y="876" width="18" height="12" rx="3" fill="url(#g-future)" stroke="#54aeff" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="354" y="886" font-size="10" fill="#1f2328">Future integration</text>

  <line x1="462" y1="882" x2="486" y2="882" stroke="#57606a" stroke-width="2" stroke-linecap="round" marker-end="url(#arr)"/>
  <text x="494" y="886" font-size="10" fill="#1f2328">Flow</text>

</svg>
