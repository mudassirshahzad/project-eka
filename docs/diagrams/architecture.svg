<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1154 802" width="1154" height="802"
     font-family="'Segoe UI', system-ui, -apple-system, sans-serif">

  <!-- Project EKA — High-Level Architecture, v0.8.5.
       Executive presentation of the same architecture verified against the repository:
       four REST controllers, 24 domain port interfaces, single published library jar,
       docker-compose externals (postgres:16, weaviate:1.25.0, ollama). -->

  <defs>
    <marker id="a-blue" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L9,3.5 z" fill="#93b4f5"/>
    </marker>
    <marker id="a-green" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L9,3.5 z" fill="#86d3a4"/>
    </marker>
    <marker id="a-rail" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto">
      <path d="M0,0 L0,8 L10,4 z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect width="1154" height="802" fill="#ffffff"/>

