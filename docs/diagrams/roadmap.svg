<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 940" width="760" height="940"
     font-family="'Segoe UI', system-ui, -apple-system, sans-serif">

  <!-- Project EKA — Roadmap, complete delivery timeline, current as of v0.8.5 (2026-09-26).
       Every row verified against git tags, CHANGELOG.md, README.md's release history and
       .claude/PROJECT_STATE.md. docs/roadmap.md is historical only and was not used for scope. -->

  <rect width="760" height="940" fill="#ffffff"/>

  <!-- Title -->
  <text x="380" y="40" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Project EKA — Roadmap</text>
