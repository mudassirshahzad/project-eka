  <text x="110" y="448" font-size="12" font-weight="700" fill="#15803d">Phase 5 — Retrieval &amp; RAG</text>
  <text x="110" y="467" font-size="10" fill="#16a34a">Hybrid retrieval (BM25 + ANN + RRF) · context assembly · citations · REST API · JWT auth · tenant isolation</text>

  <!-- ══════════ 6 · Product Hardening ══════════ -->
  <rect x="92" y="504" width="624" height="60" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2"/>
  <rect x="92" y="504" width="4" height="60" fill="#16a34a"/>
