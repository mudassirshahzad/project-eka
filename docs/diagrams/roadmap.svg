  <text x="110" y="528" font-size="12" font-weight="700" fill="#15803d">Phase 6 — Product Hardening</text>
  <text x="110" y="547" font-size="10" fill="#16a34a">Repository governance · document-ingestion REST surface · Authorization Filter · independent audit remediation</text>

