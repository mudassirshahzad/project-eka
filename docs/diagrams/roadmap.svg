  <text x="110" y="128" font-size="12" font-weight="700" fill="#15803d">Phase 1 — Architecture Foundation</text>
  <text x="110" y="147" font-size="10" fill="#16a34a">Hexagonal scaffold · domain model &amp; port interfaces · 8 ArchUnit rules enforced from the first release</text>

  <!-- ══════════ 2 · Persistence Foundation ══════════ -->
  <rect x="92" y="184" width="624" height="60" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2"/>
  <rect x="92" y="184" width="4" height="60" fill="#16a34a"/>
  <circle cx="62" cy="214" r="12" fill="#16a34a"/>
  <path d="M57,214 L60.5,218 L67,210.5" stroke="#ffffff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
