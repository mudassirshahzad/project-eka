  <text x="673" y="687" text-anchor="middle" font-size="10" font-weight="600" fill="#64748b">v0.9.0</text>
  <text x="110" y="688" font-size="12" font-weight="700" fill="#475569">Phase 8 — Ecosystem Readiness</text>
  <text x="110" y="707" font-size="10" fill="#94a3b8">Prometheus · Grafana · SSE streaming on the chat endpoint · MCP spike — go/no-go recommendation only</text>

  <!-- ══════════ 9 · v1.0.0 ══════════ -->
  <rect x="92" y="744" width="624" height="60" rx="6" fill="#f8fafc" stroke="#2563eb" stroke-width="1.4" stroke-dasharray="5,3"/>
