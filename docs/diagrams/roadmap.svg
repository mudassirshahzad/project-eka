  <!-- ══════════ Footnotes ══════════ -->
  <text x="380" y="896" text-anchor="middle" font-size="9.5" fill="#94a3b8">Phase 7 stays open until a measurable retrieval-relevance improvement is demonstrated (ADR RQ07); Phase 8 must not begin before it closes.</text>
  <text x="380" y="914" text-anchor="middle" font-size="9.5" fill="#94a3b8">Explicitly out of scope before v1.0.0 — MCP server (full delivery), LangGraph orchestration, multi-agent platform, semantic caching, external cloud LLM providers.</text>

