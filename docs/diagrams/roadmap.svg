  <text x="110" y="227" font-size="10" fill="#16a34a">Flyway V001–V016 · JPA adapters for every aggregate · TenantId on every entity from the first migration</text>

  <!-- ══════════ 3 · Application Layer ══════════ -->
  <rect x="92" y="264" width="624" height="60" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2"/>
