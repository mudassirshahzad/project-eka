  <text x="653" y="607" text-anchor="middle" font-size="10" font-weight="600" fill="#b45309">v0.8.0 – v0.8.5</text>
  <text x="110" y="608" font-size="12" font-weight="700" fill="#b45309">Phase 7 — Platform Maturity  (current)</text>
  <text x="110" y="627" font-size="10" fill="#d97706">Published GitHub Package · reusable Java library · security remediation · retrieval quality · 819 tests, 11 rules</text>

  <!-- ══════════ 8 · Ecosystem Readiness ══════════ -->
  <rect x="92" y="664" width="624" height="60" rx="6" fill="#fafafa" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="5,3"/>
