  <text x="110" y="768" font-size="12" font-weight="700" fill="#1d4ed8">v1.0.0 — Stable Enterprise Release</text>
  <text x="110" y="787" font-size="10" fill="#3b82f6">Reviewed as a gate against the frozen v1.0.0 definition — never assumed from phase completion alone</text>

  <!-- ══════════ Legend ══════════ -->
  <rect x="92" y="832" width="624" height="38" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>

