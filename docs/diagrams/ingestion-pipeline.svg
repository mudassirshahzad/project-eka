<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 840" width="560" height="840"
     font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', sans-serif">

  <!-- Shared design tokens — identical to docs/diagrams/retrieval-pipeline.svg -->
  <defs>
    <linearGradient id="g-impl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#1f8b3d"/>
      <stop offset="100%" stop-color="#16702f"/>
    </linearGradient>

    <filter id="elev" x="-20%" y="-25%" width="140%" height="165%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#0b1b2b" flood-opacity="0.16"/>
    </filter>

    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#57606a"/>
    </marker>
  </defs>

  <!-- Opaque light canvas: keeps contrast identical in GitHub light and dark mode -->
  <rect width="560" height="840" fill="#ffffff"/>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- TITLE                                                   -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <text x="280" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2328" letter-spacing="0.2">Document Ingestion Pipeline</text>
  <rect x="256" y="41" width="48" height="3" rx="1.5" fill="#0969da"/>
  <text x="280" y="61" text-anchor="middle" font-size="11" fill="#59636e">v0.4.0 — Fully Implemented</text>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- STATE COLUMN HEADER                                     -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <text x="34" y="78" font-size="9" fill="#57606a" font-weight="700" letter-spacing="1.1">STATE</text>
  <line x1="34" y1="82" x2="100" y2="82" stroke="#d0d7de" stroke-width="1"/>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- Layout: box x=110 w=330 h=62 gap=18 stride=80          -->
  <!-- Boxes: y=88,168,248,328,408,488,568,648                 -->
  <!-- Step badge: circle cx=136, cy = y+31                    -->
  <!-- ═══════════════════════════════════════════════════════ -->

  <!-- ── STEP 1: Upload & Register ── -->
  <text x="34" y="123" font-size="9" fill="#59636e" font-weight="600">PENDING</text>
  <rect x="110" y="88" width="330" height="62" rx="8" fill="url(#g-impl)" stroke="#0f5c27" stroke-width="1.25" filter="url(#elev)"/>
  <circle cx="136" cy="119" r="11" fill="#ffffff" fill-opacity="0.16" stroke="#ffffff" stroke-opacity="0.38" stroke-width="1"/>
  <text x="136" y="123" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">1</text>
  <text x="283" y="114" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff" letter-spacing="0.15">Upload &amp; Register</text>
  <text x="283" y="133" text-anchor="middle" font-size="10" fill="#ffffff" fill-opacity="0.84">Document registered in DB · PENDING status assigned</text>
  <line x1="275" y1="150" x2="275" y2="166" stroke="#57606a" stroke-width="2" stroke-linecap="round" marker-end="url(#arr)"/>

  <!-- ── STEP 2: Input Validation ── -->
  <text x="34" y="203" font-size="9" fill="#59636e" font-weight="600">PENDING</text>
  <rect x="110" y="168" width="330" height="62" rx="8" fill="url(#g-impl)" stroke="#0f5c27" stroke-width="1.25" filter="url(#elev)"/>
  <circle cx="136" cy="199" r="11" fill="#ffffff" fill-opacity="0.16" stroke="#ffffff" stroke-opacity="0.38" stroke-width="1"/>
  <text x="136" y="203" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">2</text>
  <text x="283" y="194" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff" letter-spacing="0.15">Input Validation</text>
  <text x="283" y="213" text-anchor="middle" font-size="10" fill="#ffffff" fill-opacity="0.84">Filename · format · content · extension consistency</text>
  <line x1="275" y1="230" x2="275" y2="246" stroke="#57606a" stroke-width="2" stroke-linecap="round" marker-end="url(#arr)"/>

  <!-- ── STEP 3: Apache Tika Parsing ── -->
  <!-- NOTE: Parsing runs BEFORE file storage. A parse failure rolls back  -->
  <!-- the DB insert without writing any files — by design.                -->
  <text x="34" y="283" font-size="9" fill="#59636e" font-weight="600">PARSING</text>
  <rect x="110" y="248" width="330" height="62" rx="8" fill="url(#g-impl)" stroke="#0f5c27" stroke-width="1.25" filter="url(#elev)"/>
  <circle cx="136" cy="279" r="11" fill="#ffffff" fill-opacity="0.16" stroke="#ffffff" stroke-opacity="0.38" stroke-width="1"/>
  <text x="136" y="283" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">3</text>
  <text x="283" y="274" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff" letter-spacing="0.15">Apache Tika Parsing</text>
  <text x="283" y="293" text-anchor="middle" font-size="10" fill="#ffffff" fill-opacity="0.84">Magic-byte detection · multi-format text extraction</text>
  <line x1="275" y1="310" x2="275" y2="326" stroke="#57606a" stroke-width="2" stroke-linecap="round" marker-end="url(#arr)"/>

  <!-- ── STEP 4: Metadata Extraction ── -->
  <text x="34" y="363" font-size="9" fill="#59636e" font-weight="600">PARSING</text>
  <rect x="110" y="328" width="330" height="62" rx="8" fill="url(#g-impl)" stroke="#0f5c27" stroke-width="1.25" filter="url(#elev)"/>
  <circle cx="136" cy="359" r="11" fill="#ffffff" fill-opacity="0.16" stroke="#ffffff" stroke-opacity="0.38" stroke-width="1"/>
  <text x="136" y="363" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">4</text>
  <text x="283" y="354" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff" letter-spacing="0.15">Metadata Extraction</text>
  <text x="283" y="373" text-anchor="middle" font-size="10" fill="#ffffff" fill-opacity="0.84">Title · author · pageCount · characterCount</text>
  <line x1="275" y1="390" x2="275" y2="406" stroke="#57606a" stroke-width="2" stroke-linecap="round" marker-end="url(#arr)"/>

  <!-- ── STEP 5: Store Files ── -->
  <text x="34" y="443" font-size="9" fill="#59636e" font-weight="600">PARSING</text>
  <rect x="110" y="408" width="330" height="62" rx="8" fill="url(#g-impl)" stroke="#0f5c27" stroke-width="1.25" filter="url(#elev)"/>
  <circle cx="136" cy="439" r="11" fill="#ffffff" fill-opacity="0.16" stroke="#ffffff" stroke-opacity="0.38" stroke-width="1"/>
  <text x="136" y="443" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">5</text>
  <text x="283" y="434" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff" letter-spacing="0.15">Store Files</text>
  <text x="283" y="453" text-anchor="middle" font-size="10" fill="#ffffff" fill-opacity="0.84">Raw file + extracted text → {tenantId}/{docId}/</text>
  <line x1="275" y1="470" x2="275" y2="486" stroke="#57606a" stroke-width="2" stroke-linecap="round" marker-end="url(#arr)"/>

  <!-- ── STEP 6: Chunking ── -->
  <text x="34" y="523" font-size="9" fill="#59636e" font-weight="600">CHUNKING</text>
  <rect x="110" y="488" width="330" height="62" rx="8" fill="url(#g-impl)" stroke="#0f5c27" stroke-width="1.25" filter="url(#elev)"/>
  <circle cx="136" cy="519" r="11" fill="#ffffff" fill-opacity="0.16" stroke="#ffffff" stroke-opacity="0.38" stroke-width="1"/>
  <text x="136" y="523" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">6</text>
  <text x="283" y="514" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff" letter-spacing="0.15">Chunking</text>
  <text x="283" y="533" text-anchor="middle" font-size="10" fill="#ffffff" fill-opacity="0.84">Token-aware sliding window · paragraph snapping</text>
  <line x1="275" y1="550" x2="275" y2="566" stroke="#57606a" stroke-width="2" stroke-linecap="round" marker-end="url(#arr)"/>

  <!-- ── STEP 7: Embedding Generation ── -->
  <text x="34" y="603" font-size="9" fill="#59636e" font-weight="600">EMBEDDING</text>
  <rect x="110" y="568" width="330" height="62" rx="8" fill="url(#g-impl)" stroke="#0f5c27" stroke-width="1.25" filter="url(#elev)"/>
  <circle cx="136" cy="599" r="11" fill="#ffffff" fill-opacity="0.16" stroke="#ffffff" stroke-opacity="0.38" stroke-width="1"/>
  <text x="136" y="603" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">7</text>
  <text x="283" y="594" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff" letter-spacing="0.15">Embedding Generation</text>
  <text x="283" y="613" text-anchor="middle" font-size="10" fill="#ffffff" fill-opacity="0.84">nomic-embed-text via Ollama · 768-dim · batch=32</text>
  <line x1="275" y1="630" x2="275" y2="646" stroke="#57606a" stroke-width="2" stroke-linecap="round" marker-end="url(#arr)"/>

  <!-- ── STEP 8: Weaviate Indexing ── -->
  <text x="34" y="683" font-size="9" fill="#59636e" font-weight="600">EMBEDDING</text>
  <rect x="110" y="648" width="330" height="62" rx="8" fill="url(#g-impl)" stroke="#0f5c27" stroke-width="1.25" filter="url(#elev)"/>
  <circle cx="136" cy="679" r="11" fill="#ffffff" fill-opacity="0.16" stroke="#ffffff" stroke-opacity="0.38" stroke-width="1"/>
  <text x="136" y="683" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">8</text>
  <text x="283" y="674" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff" letter-spacing="0.15">Weaviate Indexing</text>
  <text x="283" y="693" text-anchor="middle" font-size="10" fill="#ffffff" fill-opacity="0.84">Batch upsert · idempotent re-index · vectorId persisted</text>
  <line x1="275" y1="710" x2="275" y2="726" stroke="#57606a" stroke-width="2" stroke-linecap="round" marker-end="url(#arr)"/>

  <!-- ── STEP 9: INDEXED terminal (thicker border marks the terminal state) ── -->
  <text x="34" y="762" font-size="9" fill="#1a7f37" font-weight="700">INDEXED</text>
  <rect x="110" y="728" width="330" height="66" rx="8" fill="url(#g-impl)" stroke="#0f5c27" stroke-width="2.5" filter="url(#elev)"/>

  <!-- Check icon (offset left, clear of text) -->
  <circle cx="148" cy="761" r="12" fill="#ffffff" fill-opacity="0.16" stroke="#ffffff" stroke-width="2"/>
  <polyline points="141.5,761 146.5,767 155.5,753" fill="none" stroke="#ffffff" stroke-width="2.2"
            stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Text shifted right to clear the check icon -->
  <text x="300" y="757" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff" letter-spacing="0.15">Document Indexed</text>
  <text x="300" y="776" text-anchor="middle" font-size="10" fill="#ffffff" fill-opacity="0.86">Status: INDEXED · vectorIds persisted to PostgreSQL</text>

</svg>
