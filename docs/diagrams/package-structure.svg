<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 720" width="760" height="720"
     font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', sans-serif">

  <!-- Shared design tokens — identical to docs/diagrams/retrieval-pipeline.svg -->
  <defs>
    <linearGradient id="g-impl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#1f8b3d"/>
      <stop offset="100%" stop-color="#16702f"/>
    </linearGradient>
    <linearGradient id="g-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#1f6feb"/>
      <stop offset="100%" stop-color="#0860ca"/>
    </linearGradient>

    <filter id="elev" x="-20%" y="-25%" width="140%" height="165%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#0b1b2b" flood-opacity="0.16"/>
    </filter>
    <filter id="elev-sm" x="-20%" y="-25%" width="140%" height="165%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0b1b2b" flood-opacity="0.13"/>
    </filter>

    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#57606a"/>
    </marker>
  </defs>

  <!-- Opaque light canvas: keeps contrast identical in GitHub light and dark mode -->
  <rect width="760" height="720" fill="#ffffff"/>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- TITLE                                                   -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <text x="380" y="33" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2328" letter-spacing="0.2">Project EKA — Package Structure</text>
  <rect x="356" y="40" width="48" height="3" rx="1.5" fill="#0969da"/>
  <text x="380" y="58" text-anchor="middle" font-size="11" fill="#59636e">Hexagonal Architecture (Ports &amp; Adapters)</text>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- API LAYER (inbound adapter — implemented since v0.6.0)  -->
  <!-- Sits ABOVE the concentric rings — primary/driving side  -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <rect x="290" y="64" width="200" height="50" rx="8" fill="url(#g-impl)" stroke="#0f5c27" stroke-width="1.25" filter="url(#elev)"/>
  <text x="390" y="85" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff" letter-spacing="0.5">API LAYER</text>
  <text x="390" y="102" text-anchor="middle" font-size="10" fill="#ffffff" fill-opacity="0.84">REST Controllers · DTOs</text>

  <!-- Label: inbound adapter -->
  <text x="506" y="78" font-size="9" fill="#8c959f" font-weight="700" letter-spacing="0.5">INBOUND</text>
  <text x="506" y="91" font-size="9" fill="#8c959f" font-weight="700" letter-spacing="0.5">ADAPTER</text>

  <line x1="390" y1="114" x2="390" y2="136" stroke="#57606a" stroke-width="2" stroke-linecap="round" marker-end="url(#arr)"/>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- INFRASTRUCTURE ring (outermost container)               -->
  <!-- x=28 y=138 w=704 h=488                                  -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <rect x="28" y="138" width="704" height="488" rx="12" fill="#fbfcfd" stroke="#e1e7ee" stroke-width="1"/>
  <text x="76" y="161" font-size="11" font-weight="700" fill="#57606a" letter-spacing="1">INFRASTRUCTURE</text>
  <text x="76" y="177" font-size="10" fill="#8c959f">Outbound Adapters · JPA · Weaviate · Ollama · Tika · Storage · Events</text>

  <!-- Label: outbound adapter (right side) -->
  <text x="690" y="161" font-size="9" fill="#8c959f" font-weight="700" text-anchor="end" letter-spacing="0.5">OUTBOUND</text>
  <text x="690" y="174" font-size="9" fill="#8c959f" font-weight="700" text-anchor="end" letter-spacing="0.5">ADAPTERS</text>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- APPLICATION ring                                        -->
  <!-- x=128 y=190 w=504 h=384                                 -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <rect x="128" y="190" width="504" height="384" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
  <text x="172" y="212" font-size="11" font-weight="700" fill="#57606a" letter-spacing="1">APPLICATION</text>
  <text x="172" y="227" font-size="10" fill="#8c959f">Use Cases · Commands · Domain Events · Application Services</text>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- DOMAIN core (the centre everything depends on)          -->
  <!-- x=228 y=248 w=304 h=282                                 -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <rect x="228" y="248" width="304" height="282" rx="10" fill="url(#g-accent)" stroke="#0a4fa3" stroke-width="1.5" filter="url(#elev)"/>
  <text x="380" y="272" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff" letter-spacing="0.5">DOMAIN</text>
  <text x="380" y="289" text-anchor="middle" font-size="10" fill="#ffffff" fill-opacity="0.84">Pure Java · Zero framework dependencies</text>

  <!-- Domain sub-packages (2 rows of 2) -->
  <rect x="244" y="302" width="118" height="36" rx="5" fill="#ffffff" fill-opacity="0.16" stroke="#ffffff" stroke-opacity="0.42" stroke-width="1"/>
  <text x="303" y="317" text-anchor="middle" font-size="10" font-weight="600" fill="#ffffff">document</text>
  <text x="303" y="331" text-anchor="middle" font-size="9" fill="#ffffff" fill-opacity="0.82">Document · Chunk</text>

  <rect x="398" y="302" width="118" height="36" rx="5" fill="#ffffff" fill-opacity="0.16" stroke="#ffffff" stroke-opacity="0.42" stroke-width="1"/>
  <text x="457" y="317" text-anchor="middle" font-size="10" font-weight="600" fill="#ffffff">shared</text>
  <text x="457" y="331" text-anchor="middle" font-size="9" fill="#ffffff" fill-opacity="0.82">TenantId · UserId</text>

  <rect x="244" y="350" width="118" height="36" rx="5" fill="#ffffff" fill-opacity="0.16" stroke="#ffffff" stroke-opacity="0.42" stroke-width="1"/>
  <text x="303" y="365" text-anchor="middle" font-size="10" font-weight="600" fill="#ffffff">user</text>
  <text x="303" y="379" text-anchor="middle" font-size="9" fill="#ffffff" fill-opacity="0.82">User aggregate</text>

  <rect x="398" y="350" width="118" height="36" rx="5" fill="#ffffff" fill-opacity="0.16" stroke="#ffffff" stroke-opacity="0.42" stroke-width="1"/>
  <text x="457" y="365" text-anchor="middle" font-size="10" font-weight="600" fill="#ffffff">conversation</text>
  <text x="457" y="379" text-anchor="middle" font-size="9" fill="#ffffff" fill-opacity="0.82">Chat · Query</text>

  <!-- Port Interfaces box (dashed = boundary between domain and infra) -->
  <rect x="244" y="402" width="272" height="48" rx="5" fill="#ffffff" fill-opacity="0.10" stroke="#ffffff" stroke-opacity="0.55" stroke-width="1.2" stroke-dasharray="4,2"/>
  <text x="380" y="418" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">« Port Interfaces »</text>
  <text x="380" y="431" text-anchor="middle" font-size="9" fill="#ffffff" fill-opacity="0.82">FileStorage · DocumentParser</text>
  <text x="380" y="444" text-anchor="middle" font-size="9" fill="#ffffff" fill-opacity="0.82">VectorStore · EmbeddingProvider</text>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- INFRASTRUCTURE ADAPTERS (left side — 3 adapters)        -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <rect x="42" y="262" width="78" height="50" rx="6" fill="url(#g-impl)" stroke="#0f5c27" stroke-width="1.1" filter="url(#elev-sm)"/>
  <text x="81" y="283" text-anchor="middle" font-size="10" font-weight="600" fill="#ffffff">PostgreSQL</text>
  <text x="81" y="298" text-anchor="middle" font-size="9" fill="#ffffff" fill-opacity="0.82">JPA / Flyway</text>

  <rect x="42" y="332" width="78" height="50" rx="6" fill="url(#g-impl)" stroke="#0f5c27" stroke-width="1.1" filter="url(#elev-sm)"/>
  <text x="81" y="353" text-anchor="middle" font-size="10" font-weight="600" fill="#ffffff">Weaviate</text>
  <text x="81" y="368" text-anchor="middle" font-size="9" fill="#ffffff" fill-opacity="0.82">Vector Store</text>

  <rect x="42" y="402" width="78" height="50" rx="6" fill="url(#g-impl)" stroke="#0f5c27" stroke-width="1.1" filter="url(#elev-sm)"/>
  <text x="81" y="423" text-anchor="middle" font-size="10" font-weight="600" fill="#ffffff">Ollama</text>
  <text x="81" y="438" text-anchor="middle" font-size="9" fill="#ffffff" fill-opacity="0.82">Embedding</text>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- INFRASTRUCTURE ADAPTERS (right side — 3 adapters)       -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <rect x="640" y="262" width="78" height="50" rx="6" fill="url(#g-impl)" stroke="#0f5c27" stroke-width="1.1" filter="url(#elev-sm)"/>
  <text x="679" y="283" text-anchor="middle" font-size="10" font-weight="600" fill="#ffffff">Apache Tika</text>
  <text x="679" y="298" text-anchor="middle" font-size="9" fill="#ffffff" fill-opacity="0.82">Doc Parser</text>

  <rect x="640" y="332" width="78" height="50" rx="6" fill="url(#g-impl)" stroke="#0f5c27" stroke-width="1.1" filter="url(#elev-sm)"/>
  <text x="679" y="353" text-anchor="middle" font-size="10" font-weight="600" fill="#ffffff">File Storage</text>
  <text x="679" y="368" text-anchor="middle" font-size="9" fill="#ffffff" fill-opacity="0.82">Local FS</text>

  <rect x="640" y="402" width="78" height="50" rx="6" fill="url(#g-impl)" stroke="#0f5c27" stroke-width="1.1" filter="url(#elev-sm)"/>
  <text x="679" y="423" text-anchor="middle" font-size="10" font-weight="600" fill="#ffffff">Events</text>
  <text x="679" y="438" text-anchor="middle" font-size="9" fill="#ffffff" fill-opacity="0.82">Spring Events</text>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- ADAPTER → APPLICATION BOUNDARY ARROWS                   -->
  <!-- Adapters call Application use cases and implement       -->
  <!-- Domain ports for outbound calls                         -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <line x1="120" y1="287" x2="126" y2="287" stroke="#57606a" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arr)"/>
  <line x1="120" y1="357" x2="126" y2="357" stroke="#57606a" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arr)"/>
  <line x1="120" y1="427" x2="126" y2="427" stroke="#57606a" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arr)"/>

  <line x1="640" y1="287" x2="634" y2="287" stroke="#57606a" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arr)"/>
  <line x1="640" y1="357" x2="634" y2="357" stroke="#57606a" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arr)"/>
  <line x1="640" y1="427" x2="634" y2="427" stroke="#57606a" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arr)"/>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- DEPENDENCY RULE                                         -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <text x="380" y="650" text-anchor="middle" font-size="10" fill="#59636e">
    Dependency rule: outer layers depend on inner layers — Domain has no outward dependencies
  </text>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- LEGEND                                                  -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <rect x="28" y="664" width="380" height="40" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>

  <rect x="44" y="677" width="18" height="12" rx="3" fill="url(#g-impl)" stroke="#0f5c27" stroke-width="1"/>
  <text x="68" y="687" font-size="10" fill="#1f2328">Implemented</text>

  <rect x="140" y="677" width="18" height="12" rx="3" fill="url(#g-accent)" stroke="#0a4fa3" stroke-width="1"/>
  <text x="164" y="687" font-size="10" fill="#1f2328">Domain core</text>

  <rect x="236" y="677" width="18" height="12" rx="3" fill="#cfe0f5" stroke="#8fb6e4" stroke-width="1"/>
  <text x="260" y="687" font-size="10" fill="#1f2328">Sub-package</text>

  <rect x="334" y="677" width="18" height="12" rx="3" fill="#e8eef6" stroke="#8fb6e4" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="358" y="687" font-size="10" fill="#1f2328">Port</text>

</svg>
