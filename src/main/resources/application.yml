server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: project-eka

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/project_eka}
    username: ${DB_USERNAME:ka_user}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: KaHikariPool
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
    out-of-order: false

  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 110MB

  ai:
    ollama:
      base-url: ${OLLAMA_URL:http://localhost:11434}
      chat:
        model: ${OLLAMA_CHAT_MODEL:qwen3}
        options:
          temperature: 0.1
          num-ctx: 8192
      embedding:
        model: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
    vectorstore:
      weaviate:
        scheme: ${WEAVIATE_SCHEME:http}
        host: ${WEAVIATE_HOST:localhost:8080}
        api-key: ${WEAVIATE_API_KEY:}
        object-class: DocumentChunk
        consistency-level: ONE
        metadata-fields:
          - name: chunkId
            type: TEXT
          - name: documentId
            type: TEXT
          - name: tenantId
            type: TEXT
          - name: sequenceNumber
            type: NUMBER
          - name: department
            type: TEXT
          - name: classification
            type: TEXT
          - name: tags
            type: TEXT
          - name: pageNumber
            type: NUMBER
          - name: sectionTitle
            type: TEXT
          - name: chunkingStrategy
            type: TEXT
          - name: tokenCount
            type: NUMBER

security:
  jwt:
    secret-key: ${JWT_SECRET_KEY}
    access-token-expiry-ms: ${JWT_ACCESS_EXPIRY_MS:900000}
    refresh-token-expiry-ms: ${JWT_REFRESH_EXPIRY_MS:604800000}

app:
  login-rate-limit:
    max-attempts-per-minute: ${LOGIN_RATE_LIMIT_PER_MINUTE:10}
  request:
    max-body-bytes: ${MAX_REQUEST_BODY_BYTES:1048576}
  ollama:
    connect-timeout-ms: 5000
    read-timeout-ms: 60000
  ingestion:
    chunk-size: 512
    chunk-overlap: 64
    embedding-batch-size: 32
  retrieval:
    top-k-candidates: 20
    top-k-results: 5
    hybrid-alpha: 0.75
    rrf-k: 60
    query-rewrite:
      enabled: true
  context:
    max-chunks: 10
    token-budget: 4096
  conversation:
    memory-window-size: 10
  guardrails:
    max-response-length: 8192
  storage:
    document-root: ${DOCUMENT_STORAGE_ROOT:/data/documents}

management:
  server:
    port: ${MANAGEMENT_PORT:${server.port}}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    group:
      readiness:
        include: readinessState,db,ollama,weaviate
  metrics:
    tags:
      application: ${spring.application.name}
  info:
    env:
      enabled: true

info:
  app:
    name: Project EKA
    description: Enterprise Knowledge Assistant — retrieval-augmented generation platform
    # version is deliberately absent here (v0.6.1, ADR EX03) — /actuator/info now surfaces
    # info.build.version instead, generated from build.gradle's `version` at build time via
    # springBoot { buildInfo() }, so there is exactly one place a release number is typed.

logging:
  structured:
    format:
      console: ecs
  level:
    com.mudassirshahzad.eka: INFO
    org.springframework.ai: INFO
    org.hibernate.SQL: WARN

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    password: ka_pass
  jpa:
    show-sql: true
  ai:
    ollama:
      base-url: http://localhost:11434

security:
  jwt:
    secret-key: dev-only-secret-key-do-not-use-in-production-environments-0123456789

logging:
  level:
    com.mudassirshahzad.eka: DEBUG
    org.springframework.ai: DEBUG

---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:tc:postgresql:16:///project_eka_test
    password: test
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver

security:
  jwt:
    secret-key: test-only-secret-key-not-for-production-use-abcdefghijklmnopqrstuv
