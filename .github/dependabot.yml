# Dependabot configuration — Phase 7 / WP-1 (ADR CG01).
#
# Complements, and does not replace, the dependency-review gate in
# .github/workflows/build.yml: dependency-review blocks a pull request that would
# *introduce* a known-vulnerable dependency, while Dependabot opens pull requests to
# upgrade dependencies that became vulnerable (or simply went stale) after they were
# already merged. Neither mechanism covers the other's case.

version: 2

updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
    groups:
      # Spring Boot and Spring AI release their modules in lockstep; upgrading them
      # one pull request at a time produces a series of individually-broken builds.
      #
      # `update-types` is deliberately capped at minor/patch. Without it, Dependabot
      # groups a Spring Boot major and a Spring AI major into a single pull request
      # (this is exactly how PR #3 proposed Boot 3.5 -> 4.1 *and* Spring AI 1.0 -> 2.0
      # together, and could never go green). Majors in this stack are migrations, not
      # upgrades: Boot 4 additionally requires springdoc 3 and a newer Gradle, so it is
      # raised deliberately as its own milestone with its own planning session — see
      # docs/analysis/dependency-roadmap.md section 6.
      spring:
        patterns:
          - "org.springframework*"
          - "io.spring*"
        update-types:
          - minor
          - patch
      test:
        patterns:
          - "org.testcontainers:*"
          - "com.tngtech.archunit:*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci(deps)"
