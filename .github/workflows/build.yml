name: Build

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
    # Release tags build *and* publish the library to GitHub Packages (see the
    # `publish` job). Branch pushes deliberately do not publish — the project version
    # is a fixed release number, and GitHub Packages rejects re-publishing one, so a
    # publish-on-every-push job would fail on the second commit after each release.
    tags: [ 'v*' ]

permissions:
  contents: read

jobs:
  build:
    name: Build, test, ArchUnit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 8.12
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.12'

      # No committed Gradle wrapper in this repo (matches local dev convention,
      # see .claude/PROJECT_STATE.md "Build Tool") — setup-gradle above provisions
      # the exact Gradle version used locally instead.
      # The `test` Spring profile (application.yml) sets its own literal DB/JWT
      # values, overriding the base profile's required-env-var placeholders —
      # no secrets need to be injected into this workflow.
      - name: gradle clean build
        run: gradle clean build

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: build/reports/tests/test
          retention-days: 14

  # Phase 7 / WP-1 (ADR CG01) — software composition analysis.
  # Gradle dependencies are not parsed into GitHub's dependency graph automatically;
  # this job resolves the real dependency tree and submits it, which is what gives
  # Dependabot alerts (and the dependency-review job below) something accurate to
  # scan against. Push-only: the graph describes what is actually on `main`.
  dependency-submission:
    name: Submit dependency graph
    # Branch pushes only, not tags: the graph describes what is currently on `main`,
    # and re-submitting an identical tree for the tag that points at the same commit
    # would just overwrite it with itself.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Submit Gradle dependency graph
        uses: gradle/actions/dependency-submission@v6
        with:
          gradle-version: '8.12'

  # Phase 7 / WP-1 (ADR CG01) — the actual CI gate: fails a pull request that would
  # introduce a dependency with a known high-or-worse advisory, before it reaches `main`.
  dependency-review:
    name: Dependency review (SCA)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Review dependency changes
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

  # Phase 7 / WP-1 (ADR CG02) — closes the gap ADR EX10 disclosed: the Dockerfile
  # shipped at v0.6.1 was verified by reading, never by an actual `docker build`.
  # Runs only after the test suite passes — an image built from a red build is not
  # worth verifying.
  docker-build:
    name: Docker image build
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # Workflow expressions are passed through `env` rather than interpolated straight
      # into `run:`. `github.sha` is GitHub-controlled and safe either way, but the
      # interpolated form is the shape that becomes a script-injection bug the first time
      # someone reuses it with an attacker-controllable value (a PR title, a branch name).
      - name: Build application image
        env:
          IMAGE_TAG: project-eka:ci-${{ github.sha }}
        run: docker build --tag "$IMAGE_TAG" .

      - name: Verify image contents and runtime user
        # Deliberately narrow and deterministic. Booting the app here would only prove
        # it cannot reach Postgres/Weaviate/Ollama — an integration concern the `build`
        # job already owns against real Testcontainers. What is asserted instead is
        # exactly what this Dockerfile claims and nothing more: the boot jar is present
        # and non-empty, and the image does not run as root (ADR EX10). Both fail the
        # job if untrue.
        env:
          IMAGE: project-eka:ci-${{ github.sha }}
        run: |
          set -euo pipefail
          docker run --rm --entrypoint sh "$IMAGE" -c 'test -s /app/app.jar'
          RUNTIME_UID=$(docker run --rm --entrypoint id "$IMAGE" -u)
          if [ "$RUNTIME_UID" = "0" ]; then
            echo "Image runs as root (uid 0); Dockerfile declares a non-root user." >&2
            exit 1
          fi
          echo "Boot jar present; runtime uid=$RUNTIME_UID (non-root)."

  # Platform enablement — proves an external project can actually consume the published
  # artifact. This is not redundant with `build`: EKA's own tests compile against its own
  # source tree and can never detect a packaging defect.
  #
  # It exists because a real one slipped through. `io.spring.dependency-management` writes
  # its resolved versions into the POM's <dependencyManagement> but not into Gradle Module
  # Metadata, and Gradle prefers .module over .pom — so consumers got a versionless
  # dependency graph that failed with "Could not find org.postgresql:postgresql:." while
  # every check in this repository stayed green. See platform-smoke/README.md.
  platform-smoke:
    name: Consumer smoke test
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 8.12
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.12'

      - name: Publish the library to the local Maven repository
        run: gradle publishToMavenLocal -x test

      # The version is read from the root build rather than restated here, so this job
      # cannot silently start testing a stale coordinate after a version bump.
      - name: Resolve and run the consumer against the published artifact
        working-directory: platform-smoke
        run: |
          set -euo pipefail
          EKA_VERSION=$(cd .. && gradle -q properties --property version | awk '/^version:/ {print $2}')
          echo "Consuming com.mudassirshahzad:project-eka:${EKA_VERSION}"
          gradle run --no-daemon -PekaVersion="${EKA_VERSION}"

  # Platform enablement — publishes the *library* jar (the plain jar; the executable boot
  # jar is not a dependency artifact) so external projects can consume EKA's domain model,
  # ports and services as a versioned dependency rather than by copying source.
  #
  # Tag-triggered, and gated behind `build`: an artifact other projects will compile
  # against must never be published from a red build. `GITHUB_TOKEN` is scoped to this
  # repository and needs `packages: write`; no long-lived credential is stored anywhere.
  publish:
    name: Publish library to GitHub Packages
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 8.12
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.12'

      - name: Publish library
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gradle publishAllPublicationsToGitHubPackagesRepository
