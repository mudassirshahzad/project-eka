name: Build

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    name: Build, test, ArchUnit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 8.12
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.12'

      # No committed Gradle wrapper in this repo (matches local dev convention,
      # see .claude/PROJECT_STATE.md "Build Tool") — setup-gradle above provisions
      # the exact Gradle version used locally instead.
      # The `test` Spring profile (application.yml) sets its own literal DB/JWT
      # values, overriding the base profile's required-env-var placeholders —
      # no secrets need to be injected into this workflow.
      - name: gradle clean build
        run: gradle clean build

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/test
          retention-days: 14

  # Phase 7 / WP-1 (ADR CG01) — software composition analysis.
  # Gradle dependencies are not parsed into GitHub's dependency graph automatically;
  # this job resolves the real dependency tree and submits it, which is what gives
  # Dependabot alerts (and the dependency-review job below) something accurate to
  # scan against. Push-only: the graph describes what is actually on `main`.
  dependency-submission:
    name: Submit dependency graph
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Submit Gradle dependency graph
        uses: gradle/actions/dependency-submission@v6
        with:
          gradle-version: '8.12'

  # Phase 7 / WP-1 (ADR CG01) — the actual CI gate: fails a pull request that would
  # introduce a dependency with a known high-or-worse advisory, before it reaches `main`.
  dependency-review:
    name: Dependency review (SCA)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  # Phase 7 / WP-1 (ADR CG02) — closes the gap ADR EX10 disclosed: the Dockerfile
  # shipped at v0.6.1 was verified by reading, never by an actual `docker build`.
  # Runs only after the test suite passes — an image built from a red build is not
  # worth verifying.
  docker-build:
    name: Docker image build
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Workflow expressions are passed through `env` rather than interpolated straight
      # into `run:`. `github.sha` is GitHub-controlled and safe either way, but the
      # interpolated form is the shape that becomes a script-injection bug the first time
      # someone reuses it with an attacker-controllable value (a PR title, a branch name).
      - name: Build application image
        env:
          IMAGE_TAG: project-eka:ci-${{ github.sha }}
        run: docker build --tag "$IMAGE_TAG" .

      - name: Verify image contents and runtime user
        # Deliberately narrow and deterministic. Booting the app here would only prove
        # it cannot reach Postgres/Weaviate/Ollama — an integration concern the `build`
        # job already owns against real Testcontainers. What is asserted instead is
        # exactly what this Dockerfile claims and nothing more: the boot jar is present
        # and non-empty, and the image does not run as root (ADR EX10). Both fail the
        # job if untrue.
        env:
          IMAGE: project-eka:ci-${{ github.sha }}
        run: |
          set -euo pipefail
          docker run --rm --entrypoint sh "$IMAGE" -c 'test -s /app/app.jar'
          RUNTIME_UID=$(docker run --rm --entrypoint id "$IMAGE" -u)
          if [ "$RUNTIME_UID" = "0" ]; then
            echo "Image runs as root (uid 0); Dockerfile declares a non-root user." >&2
            exit 1
          fi
          echo "Boot jar present; runtime uid=$RUNTIME_UID (non-root)."
