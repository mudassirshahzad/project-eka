name: Build

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    name: Build, test, ArchUnit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 8.12
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'

      # No committed Gradle wrapper in this repo (matches local dev convention,
      # see .claude/PROJECT_STATE.md "Build Tool") — setup-gradle above provisions
      # the exact Gradle version used locally instead.
      # The `test` Spring profile (application.yml) sets its own literal DB/JWT
      # values, overriding the base profile's required-env-var placeholders —
      # no secrets need to be injected into this workflow.
      - name: gradle clean build
        run: gradle clean build

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/test
          retention-days: 14
